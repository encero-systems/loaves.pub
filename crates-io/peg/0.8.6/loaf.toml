# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/peg"
version = "0.8.6"

[project.features]
default = ["std"]
std = ["peg-runtime/std"]
trace = ["peg-macros/trace"]
unstable = ["peg-runtime/unstable"]

[rust]
name = "peg"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
peg-macros = { loaf = "crates-io/peg-macros", version = "=0.8.6" }
peg-runtime = { loaf = "crates-io/peg-runtime", version = "=0.8.6" }
