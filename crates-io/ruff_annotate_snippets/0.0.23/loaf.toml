# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/ruff_annotate_snippets"
version = "0.0.23"

[project.features]
default = ["std", "simd"]
simd = ["dep:memchr"]
std = ["anstyle/std", "memchr?/std"]
testing-colors = []

[rust]
name = "annotate_snippets"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anstyle = { loaf = "crates-io/anstyle", version = "^1.0.10", features = ["std"], default-features = false }
memchr = { loaf = "crates-io/memchr", version = "^2.7.1", features = ["std"], default-features = false, optional = true }
unicode-width = { loaf = "crates-io/unicode-width", version = "^0.2.0", default-features = false }
