# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/datafusion-datasource"
version = "55.3.0"

[project.features]
async-compression = ["dep:async-compression"]
backtrace = ["datafusion-common/backtrace"]
bzip2 = ["dep:bzip2"]
compression = ["async-compression", "liblzma", "bzip2", "flate2", "zstd", "tokio-util"]
default = ["compression"]
flate2 = ["dep:flate2"]
liblzma = ["dep:liblzma"]
proto = ["dep:datafusion-proto-models", "datafusion-physical-plan/proto"]
tempfile = ["dep:tempfile"]
tokio-util = ["dep:tokio-util"]
zstd = ["dep:zstd"]

[rust]
name = "datafusion_datasource"
type = "lib"
edition = "2024"
build-script = false

[rust.source]
root = "src/mod.rs"

[dependencies]
arrow = { loaf = "crates-io/arrow", version = "^59.2.0", features = ["chrono-tz", "prettyprint"] }
async-compression = { loaf = "crates-io/async-compression", version = "^0.4.40", features = ["bzip2", "gzip", "tokio", "xz", "zstd"], optional = true }
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.89" }
bytes = { loaf = "crates-io/bytes", version = "^1.11" }
bzip2 = { loaf = "crates-io/bzip2", version = "^0.6.1", optional = true }
chrono = { loaf = "crates-io/chrono", version = "^0.4.45", default-features = false }
datafusion-common = { loaf = "crates-io/datafusion-common", version = "^55.3.0", features = ["object_store"], default-features = false }
datafusion-common-runtime = { loaf = "crates-io/datafusion-common-runtime", version = "^55.3.0" }
datafusion-execution = { loaf = "crates-io/datafusion-execution", version = "^55.3.0", default-features = false }
datafusion-expr = { loaf = "crates-io/datafusion-expr", version = "^55.3.0", default-features = false }
datafusion-physical-expr = { loaf = "crates-io/datafusion-physical-expr", version = "^55.3.0", default-features = false }
datafusion-physical-expr-adapter = { loaf = "crates-io/datafusion-physical-expr-adapter", version = "^55.3.0", default-features = false }
datafusion-physical-expr-common = { loaf = "crates-io/datafusion-physical-expr-common", version = "^55.3.0", default-features = false }
datafusion-physical-plan = { loaf = "crates-io/datafusion-physical-plan", version = "^55.3.0" }
datafusion-proto-models = { loaf = "crates-io/datafusion-proto-models", version = "^55.3.0", optional = true }
datafusion-session = { loaf = "crates-io/datafusion-session", version = "^55.3.0" }
flate2 = { loaf = "crates-io/flate2", version = "^1.1.9", optional = true }
futures = { loaf = "crates-io/futures", version = "^0.3" }
glob = { loaf = "crates-io/glob", version = "^0.3.0" }
itertools = { loaf = "crates-io/itertools", version = "^0.15" }
liblzma = { loaf = "crates-io/liblzma", version = "^0.4.6", features = ["static"], optional = true }
log = { loaf = "crates-io/log", version = "^0.4" }
object_store = { loaf = "crates-io/object_store", version = "^0.13.2", default-features = false }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12" }
rand = { loaf = "crates-io/rand", version = "^0.9" }
tempfile = { loaf = "crates-io/tempfile", version = "^3", optional = true }
tokio = { loaf = "crates-io/tokio", version = "^1.52", features = ["macros", "rt", "sync"] }
tokio-util = { loaf = "crates-io/tokio-util", version = "^0.7.17", features = ["io"], optional = true }
url = { loaf = "crates-io/url", version = "^2.5.7" }
zstd = { loaf = "crates-io/zstd", version = "^0.13", default-features = false, optional = true }
