# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/ruff_ranged_value"
version = "0.0.23"

[project.features]
get-size = ["dep:get-size2"]
schemars = ["dep:schemars"]

[rust]
name = "ruff_ranged_value"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
get-size2 = { loaf = "crates-io/get-size2", version = "^0.11.0", features = ["compact-str", "derive", "hashbrown", "ordermap", "smallvec", "std", "thin-vec"], default-features = false, optional = true }
ruff_db = { loaf = "crates-io/ruff_db", version = "^0.0.23", default-features = false }
ruff_python_ast = { loaf = "crates-io/ruff_python_ast", version = "^0.0.23" }
ruff_text_size = { loaf = "crates-io/ruff_text_size", version = "^0.0.23" }
schemars = { loaf = "crates-io/schemars", version = "^1.0.4", features = ["derive", "std"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.197", features = ["derive", "std"], default-features = false }
toml = { loaf = "crates-io/toml", version = "^1.0.0", features = ["display", "parse", "serde", "std"], default-features = false }
