# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/datafusion-expr"
version = "55.3.0"

[project.features]
default = ["sql"]
proto = ["dep:datafusion-proto-common", "dep:datafusion-proto-models"]
recursive_protection = ["dep:recursive"]
sql = ["sqlparser"]
sqlparser = ["dep:sqlparser"]

[rust]
name = "datafusion_expr"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arrow = { loaf = "crates-io/arrow", version = "^59.2.0", features = ["canonical_extension_types", "chrono-tz", "prettyprint"] }
arrow-schema = { loaf = "crates-io/arrow-schema", version = "^59.2.0", features = ["canonical_extension_types"], default-features = false }
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.89" }
chrono = { loaf = "crates-io/chrono", version = "^0.4.45", default-features = false }
datafusion-common = { loaf = "crates-io/datafusion-common", version = "^55.3.0", default-features = false }
datafusion-doc = { loaf = "crates-io/datafusion-doc", version = "^55.3.0" }
datafusion-expr-common = { loaf = "crates-io/datafusion-expr-common", version = "^55.3.0" }
datafusion-functions-aggregate-common = { loaf = "crates-io/datafusion-functions-aggregate-common", version = "^55.3.0" }
datafusion-functions-window-common = { loaf = "crates-io/datafusion-functions-window-common", version = "^55.3.0" }
datafusion-physical-expr-common = { loaf = "crates-io/datafusion-physical-expr-common", version = "^55.3.0", default-features = false }
datafusion-proto-common = { loaf = "crates-io/datafusion-proto-common", version = "^55.3.0", optional = true }
datafusion-proto-models = { loaf = "crates-io/datafusion-proto-models", version = "^55.3.0", optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^2.14.0" }
itertools = { loaf = "crates-io/itertools", version = "^0.15" }
recursive = { loaf = "crates-io/recursive", version = "^0.1.1", optional = true }
serde = { loaf = "crates-io/serde", version = "^1", features = ["derive"] }
serde_json = { loaf = "crates-io/serde_json", version = "^1" }
sqlparser = { loaf = "crates-io/sqlparser", version = "^0.62.0", features = ["std", "visitor"], default-features = false, optional = true }
