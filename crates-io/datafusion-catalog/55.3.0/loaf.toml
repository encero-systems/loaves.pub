# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/datafusion-catalog"
version = "55.3.0"

[rust]
name = "datafusion_catalog"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arrow = { loaf = "crates-io/arrow", version = "^59.2.0", features = ["chrono-tz", "prettyprint"] }
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.89" }
dashmap = { loaf = "crates-io/dashmap", version = "^6.2.1" }
datafusion-common = { loaf = "crates-io/datafusion-common", version = "^55.3.0", default-features = false }
datafusion-common-runtime = { loaf = "crates-io/datafusion-common-runtime", version = "^55.3.0" }
datafusion-datasource = { loaf = "crates-io/datafusion-datasource", version = "^55.3.0", default-features = false }
datafusion-execution = { loaf = "crates-io/datafusion-execution", version = "^55.3.0", default-features = false }
datafusion-expr = { loaf = "crates-io/datafusion-expr", version = "^55.3.0", default-features = false }
datafusion-physical-expr = { loaf = "crates-io/datafusion-physical-expr", version = "^55.3.0", default-features = false }
datafusion-physical-plan = { loaf = "crates-io/datafusion-physical-plan", version = "^55.3.0" }
datafusion-session = { loaf = "crates-io/datafusion-session", version = "^55.3.0" }
futures = { loaf = "crates-io/futures", version = "^0.3" }
itertools = { loaf = "crates-io/itertools", version = "^0.15" }
log = { loaf = "crates-io/log", version = "^0.4" }
object_store = { loaf = "crates-io/object_store", version = "^0.13.2", default-features = false }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12" }
tokio = { loaf = "crates-io/tokio", version = "^1.52", features = ["macros", "rt", "sync"] }
