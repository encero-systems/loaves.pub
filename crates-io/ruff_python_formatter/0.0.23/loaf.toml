# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/ruff_python_formatter"
version = "0.0.23"

[project.features]
default = ["serde"]
schemars = ["dep:schemars", "dep:serde_json", "ruff_formatter/schemars"]
serde = ["dep:serde", "ruff_formatter/serde", "ruff_source_file/serde", "ruff_python_ast/serde"]

[rust]
name = "ruff_python_formatter"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.80", features = ["std"], default-features = false }
clap = { loaf = "crates-io/clap", version = "^4.5.3", features = ["color", "derive", "error-context", "help", "std", "suggestions", "usage"], default-features = false }
countme = { loaf = "crates-io/countme", version = "^3.0.1", default-features = false }
itertools = { loaf = "crates-io/itertools", version = "^0.15.0", features = ["use_std"], default-features = false }
memchr = { loaf = "crates-io/memchr", version = "^2.7.1", features = ["std"], default-features = false }
regex = { loaf = "crates-io/regex", version = "^1.10.2", features = ["perf", "std", "unicode"], default-features = false }
ruff_cache = { loaf = "crates-io/ruff_cache", version = "^0.0.23" }
ruff_db = { loaf = "crates-io/ruff_db", version = "^0.0.23", default-features = false }
ruff_formatter = { loaf = "crates-io/ruff_formatter", version = "^0.0.23" }
ruff_macros = { loaf = "crates-io/ruff_macros", version = "^0.0.23" }
ruff_python_ast = { loaf = "crates-io/ruff_python_ast", version = "^0.0.23" }
ruff_python_parser = { loaf = "crates-io/ruff_python_parser", version = "^0.0.23" }
ruff_python_trivia = { loaf = "crates-io/ruff_python_trivia", version = "^0.0.23" }
ruff_source_file = { loaf = "crates-io/ruff_source_file", version = "^0.0.23" }
ruff_text_size = { loaf = "crates-io/ruff_text_size", version = "^0.0.23" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.0.0", features = ["std"], default-features = false }
salsa = { loaf = "crates-io/salsa", version = "^0.28.5", features = ["compact_str", "inventory", "macros", "salsa_unstable"], default-features = false }
schemars = { loaf = "crates-io/schemars", version = "^1.0.4", features = ["derive", "std"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.197", features = ["derive", "std"], default-features = false, optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.113", features = ["std"], default-features = false, optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1.13.2", features = ["const_generics", "const_new", "union"], default-features = false }
static_assertions = { loaf = "crates-io/static_assertions", version = "^1.1.0", default-features = false }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.0", features = ["std"], default-features = false }
tracing = { loaf = "crates-io/tracing", version = "^0.1.40", features = ["attributes", "std"], default-features = false }
