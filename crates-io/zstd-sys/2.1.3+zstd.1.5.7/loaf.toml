# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/zstd-sys"
version = "2.1.3+zstd.1.5.7"

[project.features]
bindgen = []
cmake = []
debug = []
default = ["legacy", "zdict_builder"]
experimental = []
fat-lto = []
legacy = []
no_asm = []
no_wasm_shim = []
non-cargo = []
pkg-config = []
rust-backend = ["dep:libzstd-rs-sys"]
seekable = []
std = []
thin = []
thin-lto = []
vendored = []
zdict_builder = []
zstdmt = []

[rust]
name = "zstd_sys"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
libzstd-rs-sys = { loaf = "crates-io/libzstd-rs-sys", version = "=0.0.1-prerelease.2", features = ["export-symbols"], optional = true }
