# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/pep508_rs"
version = "0.9.2"

[project.features]
default = []
non-pep508-extensions = []
schemars = ["dep:schemars"]
tracing = ["dep:tracing", "pep440_rs/tracing"]

[rust]
name = "pep508_rs"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
boxcar = { loaf = "crates-io/boxcar", version = "^0.2.6" }
indexmap = { loaf = "crates-io/indexmap", version = "^2.6.0" }
itertools = { loaf = "crates-io/itertools", version = "^0.13.0" }
once_cell = { loaf = "crates-io/once_cell", version = "^1.20.2" }
pep440_rs = { loaf = "crates-io/pep440_rs", version = "^0.7.2", features = ["version-ranges"] }
regex = { loaf = "crates-io/regex", version = "^1.10.4" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.0.0" }
schemars = { loaf = "crates-io/schemars", version = "^0.8.21", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.198", features = ["derive", "rc"] }
smallvec = { loaf = "crates-io/smallvec", version = "^1.13.2" }
thiserror = { loaf = "crates-io/thiserror", version = "^1.0.59" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.40", optional = true }
unicode-width = { loaf = "crates-io/unicode-width", version = "^0.2.0" }
url = { loaf = "crates-io/url", version = "^2.5.0", features = ["serde"] }
urlencoding = { loaf = "crates-io/urlencoding", version = "^2.1.3" }
version-ranges = { loaf = "crates-io/version-ranges", version = "^0.1.0" }
