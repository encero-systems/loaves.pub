# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/lambda_runtime"
version = "1.5.0"

[project.features]
anyhow = ["dep:anyhow"]
concurrency-tokio = []
default = ["tracing"]
eyre = ["dep:eyre"]
graceful-shutdown = ["tokio/rt", "tokio/signal", "dep:lambda-extension"]
miette = ["dep:miette"]
opentelemetry = ["opentelemetry-semantic-conventions"]
opentelemetry-semantic-conventions = ["dep:opentelemetry-semantic-conventions"]
tracing = ["lambda_runtime_api_client/tracing"]

[rust]
name = "lambda_runtime"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.86", optional = true }
async-stream = { loaf = "crates-io/async-stream", version = "^0.3" }
base64 = { loaf = "crates-io/base64", version = "^0.22" }
bytes = { loaf = "crates-io/bytes", version = "^1" }
eyre = { loaf = "crates-io/eyre", version = "^0.6.12", optional = true }
futures = { loaf = "crates-io/futures", version = "^0.3" }
http = { loaf = "crates-io/http", version = "^1.0" }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1" }
http-serde = { loaf = "crates-io/http-serde", version = "^2.0" }
hyper = { loaf = "crates-io/hyper", version = "^1.0", features = ["client", "http1"] }
lambda-extension = { loaf = "crates-io/lambda-extension", version = "^1.1", default-features = false, optional = true }
lambda_runtime_api_client = { loaf = "crates-io/lambda_runtime_api_client", version = "^1.1.1", default-features = false }
miette = { loaf = "crates-io/miette", version = "^7.2.0", optional = true }
opentelemetry-semantic-conventions = { loaf = "crates-io/opentelemetry-semantic-conventions", version = "^0.32", features = ["semconv_experimental"], optional = true }
pin-project = { loaf = "crates-io/pin-project", version = "^1" }
serde = { loaf = "crates-io/serde", version = "^1", features = ["derive", "rc"] }
serde_json = { loaf = "crates-io/serde_json", version = "^1" }
serde_path_to_error = { loaf = "crates-io/serde_path_to_error", version = "^0.1.11" }
tokio = { loaf = "crates-io/tokio", version = "^1.46", features = ["io-util", "macros", "rt-multi-thread", "sync"] }
tokio-stream = { loaf = "crates-io/tokio-stream", version = "^0.1.2" }
tower = { loaf = "crates-io/tower", version = "^0.5", features = ["util"] }
tracing = { loaf = "crates-io/tracing", version = "^0.1", features = ["log"] }
