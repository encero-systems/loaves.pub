# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/lambda_http"
version = "1.3.2"

[project.features]
alb = []
anyhow = ["lambda_runtime/anyhow"]
apigw_http = []
apigw_rest = []
apigw_websockets = []
builders = ["aws_lambda_events/builders"]
catch-all-fields = ["aws_lambda_events/catch-all-fields"]
concurrency-tokio = ["lambda_runtime/concurrency-tokio"]
default = ["apigw_rest", "apigw_http", "apigw_websockets", "alb", "vpc_lattice", "tracing"]
eyre = ["lambda_runtime/eyre"]
miette = ["lambda_runtime/miette"]
opentelemetry = ["lambda_runtime/opentelemetry"]
pass_through = []
tracing = ["lambda_runtime/tracing"]
vpc_lattice = []

[rust]
name = "lambda_http"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws_lambda_events = { loaf = "crates-io/aws_lambda_events", version = "^1.2", features = ["alb", "apigw", "vpc_lattice"], default-features = false }
bytes = { loaf = "crates-io/bytes", version = "^1" }
encoding_rs = { loaf = "crates-io/encoding_rs", version = "^0.8" }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3" }
http = { loaf = "crates-io/http", version = "^1.0" }
http-body = { loaf = "crates-io/http-body", version = "^1.0" }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1" }
hyper = { loaf = "crates-io/hyper", version = "^1.0" }
lambda_runtime = { loaf = "crates-io/lambda_runtime", version = "^1.5.0", default-features = false }
mime = { loaf = "crates-io/mime", version = "^0.3" }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.2" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2" }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive"] }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0", features = ["raw_value"] }
serde_urlencoded = { loaf = "crates-io/serde_urlencoded", version = "^0.7" }
tokio-stream = { loaf = "crates-io/tokio-stream", version = "^0.1.2" }
url = { loaf = "crates-io/url", version = "^2.2" }
