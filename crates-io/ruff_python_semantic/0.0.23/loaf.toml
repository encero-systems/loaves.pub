# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/ruff_python_semantic"
version = "0.0.23"

[project.features]
schemars = ["dep:schemars"]
serde = ["dep:serde"]

[rust]
name = "ruff_python_semantic"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.5.0", default-features = false }
is-macro = { loaf = "crates-io/is-macro", version = "^0.3.5", default-features = false }
ruff_cache = { loaf = "crates-io/ruff_cache", version = "^0.0.23" }
ruff_index = { loaf = "crates-io/ruff_index", version = "^0.0.23" }
ruff_macros = { loaf = "crates-io/ruff_macros", version = "^0.0.23" }
ruff_python_ast = { loaf = "crates-io/ruff_python_ast", version = "^0.0.23" }
ruff_python_parser = { loaf = "crates-io/ruff_python_parser", version = "^0.0.23" }
ruff_python_stdlib = { loaf = "crates-io/ruff_python_stdlib", version = "^0.0.23" }
ruff_text_size = { loaf = "crates-io/ruff_text_size", version = "^0.0.23" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.0.0", features = ["std"], default-features = false }
schemars = { loaf = "crates-io/schemars", version = "^1.0.4", features = ["derive", "std"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.197", features = ["derive", "std"], default-features = false, optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1.13.2", features = ["const_generics", "const_new", "union"], default-features = false }
