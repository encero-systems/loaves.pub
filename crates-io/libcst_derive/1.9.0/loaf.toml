# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/libcst_derive"
version = "1.9.0"

[rust]
name = "libcst_derive"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0" }
