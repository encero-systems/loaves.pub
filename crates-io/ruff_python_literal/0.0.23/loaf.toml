# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/ruff_python_literal"
version = "0.0.23"

[rust]
name = "ruff_python_literal"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.5.0", default-features = false }
icu_normalizer = { loaf = "crates-io/icu_normalizer", version = "^2.1.2", features = ["compiled_data"], default-features = false }
icu_properties = { loaf = "crates-io/icu_properties", version = "^2.1.2", features = ["compiled_data"], default-features = false }
itertools = { loaf = "crates-io/itertools", version = "^0.15.0", features = ["use_std"], default-features = false }
ruff_python_ast = { loaf = "crates-io/ruff_python_ast", version = "^0.0.23" }
