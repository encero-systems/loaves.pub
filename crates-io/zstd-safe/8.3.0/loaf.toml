# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/zstd-safe"
version = "8.3.0"

[project.features]
alloc = []
arrays = []
bindgen = ["zstd-sys/bindgen"]
cmake = ["zstd-sys/cmake"]
debug = ["zstd-sys/debug"]
default = ["legacy", "arrays", "zdict_builder"]
doc-cfg = []
experimental = ["zstd-sys/experimental"]
fat-lto = ["zstd-sys/fat-lto"]
legacy = ["zstd-sys/legacy"]
no_asm = ["zstd-sys/no_asm"]
pkg-config = ["zstd-sys/pkg-config"]
rust-backend = ["zstd-sys/rust-backend"]
seekable = ["zstd-sys/seekable"]
std = ["alloc", "zstd-sys/std"]
thin = ["zstd-sys/thin"]
thin-lto = ["zstd-sys/thin-lto"]
vendored = ["zstd-sys/vendored"]
with-rust-allocator = ["experimental"]
zdict_builder = ["zstd-sys/zdict_builder"]
zstdmt = ["zstd-sys/zstdmt"]

[rust]
name = "zstd_safe"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
zstd-sys = { loaf = "crates-io/zstd-sys", version = "^2.1.3", default-features = false }
