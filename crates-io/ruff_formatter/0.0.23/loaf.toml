# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/ruff_formatter"
version = "0.0.23"

[project.features]
schemars = ["dep:schemars", "ruff_text_size/schemars"]
serde = ["dep:serde", "ruff_text_size/serde"]

[rust]
name = "ruff_formatter"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
drop_bomb = { loaf = "crates-io/drop_bomb", version = "^0.1.5", default-features = false }
ruff_cache = { loaf = "crates-io/ruff_cache", version = "^0.0.23" }
ruff_macros = { loaf = "crates-io/ruff_macros", version = "^0.0.23" }
ruff_text_size = { loaf = "crates-io/ruff_text_size", version = "^0.0.23" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.0.0", features = ["std"], default-features = false }
schemars = { loaf = "crates-io/schemars", version = "^1.0.4", features = ["derive", "std"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.197", features = ["derive", "std"], default-features = false, optional = true }
static_assertions = { loaf = "crates-io/static_assertions", version = "^1.1.0", default-features = false }
tracing = { loaf = "crates-io/tracing", version = "^0.1.40", features = ["attributes", "std"], default-features = false }
unicode-width = { loaf = "crates-io/unicode-width", version = "^0.2.0", default-features = false }
