# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/datafusion-sql"
version = "55.3.0"

[project.features]
default = ["unicode_expressions", "unparser"]
recursive_protection = ["dep:recursive", "dep:stacker"]
unicode_expressions = []
unparser = []

[rust]
name = "datafusion_sql"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arrow = { loaf = "crates-io/arrow", version = "^59.2.0", features = ["chrono-tz", "prettyprint"] }
bigdecimal = { loaf = "crates-io/bigdecimal", version = "^0.4.8" }
chrono = { loaf = "crates-io/chrono", version = "^0.4.45", default-features = false }
datafusion-common = { loaf = "crates-io/datafusion-common", version = "^55.3.0", features = ["sql"], default-features = false }
datafusion-expr = { loaf = "crates-io/datafusion-expr", version = "^55.3.0", features = ["sql"], default-features = false }
datafusion-functions-nested = { loaf = "crates-io/datafusion-functions-nested", version = "^55.3.0", features = ["sql"], default-features = false }
indexmap = { loaf = "crates-io/indexmap", version = "^2.14.0" }
log = { loaf = "crates-io/log", version = "^0.4" }
recursive = { loaf = "crates-io/recursive", version = "^0.1.1", optional = true }
regex = { loaf = "crates-io/regex", version = "^1.12" }
sqlparser = { loaf = "crates-io/sqlparser", version = "^0.62.0", features = ["std", "visitor"], default-features = false }
stacker = { loaf = "crates-io/stacker", version = "^0.1.24", optional = true }
