# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/datafusion-physical-plan"
version = "55.3.0"

[project.features]
force_hash_collisions = []
proto = ["dep:datafusion-proto-models", "dep:datafusion-proto-common", "datafusion-physical-expr/proto", "datafusion-physical-expr-common/proto"]
test_utils = ["arrow/test_utils"]
tokio_coop = []
tokio_coop_fallback = []

[rust]
name = "datafusion_physical_plan"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arrow = { loaf = "crates-io/arrow", version = "^59.2.0", features = ["chrono-tz", "prettyprint"] }
arrow-data = { loaf = "crates-io/arrow-data", version = "^59.2.0", default-features = false }
arrow-ipc = { loaf = "crates-io/arrow-ipc", version = "^59.2.0", features = ["lz4", "zstd"], default-features = false }
arrow-ord = { loaf = "crates-io/arrow-ord", version = "^59.2.0", default-features = false }
arrow-schema = { loaf = "crates-io/arrow-schema", version = "^59.2.0", default-features = false }
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.89" }
bytes = { loaf = "crates-io/bytes", version = "^1.11" }
datafusion-common = { loaf = "crates-io/datafusion-common", version = "^55.3.0", default-features = false }
datafusion-common-runtime = { loaf = "crates-io/datafusion-common-runtime", version = "^55.3.0" }
datafusion-execution = { loaf = "crates-io/datafusion-execution", version = "^55.3.0", default-features = false }
datafusion-expr = { loaf = "crates-io/datafusion-expr", version = "^55.3.0", default-features = false }
datafusion-functions = { loaf = "crates-io/datafusion-functions", version = "^55.3.0" }
datafusion-functions-aggregate-common = { loaf = "crates-io/datafusion-functions-aggregate-common", version = "^55.3.0" }
datafusion-functions-window-common = { loaf = "crates-io/datafusion-functions-window-common", version = "^55.3.0" }
datafusion-physical-expr = { loaf = "crates-io/datafusion-physical-expr", version = "^55.3.0" }
datafusion-physical-expr-common = { loaf = "crates-io/datafusion-physical-expr-common", version = "^55.3.0", default-features = false }
datafusion-proto-common = { loaf = "crates-io/datafusion-proto-common", version = "^55.3.0", optional = true }
datafusion-proto-models = { loaf = "crates-io/datafusion-proto-models", version = "^55.3.0", optional = true }
futures = { loaf = "crates-io/futures", version = "^0.3" }
half = { loaf = "crates-io/half", version = "^2.7.0", default-features = false }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.17.1" }
indexmap = { loaf = "crates-io/indexmap", version = "^2.14.0" }
itertools = { loaf = "crates-io/itertools", version = "^0.15", features = ["use_std"] }
log = { loaf = "crates-io/log", version = "^0.4" }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2" }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.7" }
serde = { loaf = "crates-io/serde", version = "^1", features = ["derive"] }
serde_json = { loaf = "crates-io/serde_json", version = "^1" }
tokio = { loaf = "crates-io/tokio", version = "^1.52", features = ["macros", "rt", "sync"] }
