# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/ruff_notebook"
version = "0.0.23"

[rust]
name = "ruff_notebook"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.80", features = ["std"], default-features = false }
rand = { loaf = "crates-io/rand", version = "^0.10.0", features = ["std_rng"], default-features = false }
ruff_diagnostics = { loaf = "crates-io/ruff_diagnostics", version = "^0.0.23" }
ruff_source_file = { loaf = "crates-io/ruff_source_file", version = "^0.0.23", features = ["serde"] }
ruff_text_size = { loaf = "crates-io/ruff_text_size", version = "^0.0.23" }
serde = { loaf = "crates-io/serde", version = "^1.0.197", features = ["derive", "std"], default-features = false }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.113", features = ["std"], default-features = false }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.0", features = ["std"], default-features = false }
uuid = { loaf = "crates-io/uuid", version = "^1.6.1", features = ["std"], default-features = false }
