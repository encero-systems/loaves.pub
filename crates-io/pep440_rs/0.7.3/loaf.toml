# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/pep440_rs"
version = "0.7.3"

[project.features]
rkyv = ["dep:rkyv"]
tracing = ["dep:tracing"]
version-ranges = ["dep:version-ranges"]

[rust]
name = "pep440_rs"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
once_cell = { loaf = "crates-io/once_cell", version = "^1.20.2" }
rkyv = { loaf = "crates-io/rkyv", version = "^0.8.9", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.210", features = ["derive"] }
tracing = { loaf = "crates-io/tracing", version = "^0.1.40", optional = true }
unicode-width = { loaf = "crates-io/unicode-width", version = "^0.2.0" }
unscanny = { loaf = "crates-io/unscanny", version = "^0.1.0" }
version-ranges = { loaf = "crates-io/version-ranges", version = "^0.1.1", optional = true }
