# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-observability"
version = "0.3.1"

[rust]
name = "aws_smithy_observability"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws-smithy-runtime-api = { loaf = "crates-io/aws-smithy-runtime-api", version = "^1.20.0", features = ["client"] }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.9.3" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.44" }
