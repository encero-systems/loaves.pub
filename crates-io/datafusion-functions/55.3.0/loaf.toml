# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/datafusion-functions"
version = "55.3.0"

[project.features]
base64 = ["dep:base64"]
blake2 = ["dep:blake2"]
blake3 = ["dep:blake3"]
chrono-tz = ["dep:chrono-tz"]
crypto_expressions = ["md-5", "sha2", "blake2", "blake3"]
datetime_expressions = ["chrono-tz"]
default = ["datetime_expressions", "encoding_expressions", "math_expressions", "regex_expressions", "string_expressions", "unicode_expressions"]
encoding_expressions = ["base64", "hex"]
hex = ["dep:hex"]
math_expressions = []
md-5 = ["dep:md-5"]
regex = ["dep:regex"]
regex_expressions = ["regex"]
sha2 = ["dep:sha2"]
string_expressions = ["uuid"]
unicode_expressions = []
uuid = ["dep:uuid"]

[rust]
name = "datafusion_functions"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arrow = { loaf = "crates-io/arrow", version = "^59.2.0", features = ["chrono-tz", "prettyprint"] }
arrow-buffer = { loaf = "crates-io/arrow-buffer", version = "^59.2.0", default-features = false }
base64 = { loaf = "crates-io/base64", version = "^0.23", optional = true }
blake2 = { loaf = "crates-io/blake2", version = "^0.10.2", optional = true }
blake3 = { loaf = "crates-io/blake3", version = "^1.8", optional = true }
chrono = { loaf = "crates-io/chrono", version = "^0.4.45", default-features = false }
chrono-tz = { loaf = "crates-io/chrono-tz", version = "^0.10.4", optional = true }
datafusion-common = { loaf = "crates-io/datafusion-common", version = "^55.3.0", default-features = false }
datafusion-doc = { loaf = "crates-io/datafusion-doc", version = "^55.3.0" }
datafusion-execution = { loaf = "crates-io/datafusion-execution", version = "^55.3.0", default-features = false }
datafusion-expr = { loaf = "crates-io/datafusion-expr", version = "^55.3.0", default-features = false }
datafusion-expr-common = { loaf = "crates-io/datafusion-expr-common", version = "^55.3.0" }
datafusion-macros = { loaf = "crates-io/datafusion-macros", version = "^55.3.0" }
datafusion-physical-expr-common = { loaf = "crates-io/datafusion-physical-expr-common", version = "^55.3.0", default-features = false }
hex = { loaf = "crates-io/hex", version = "^0.4.3", optional = true }
itertools = { loaf = "crates-io/itertools", version = "^0.15" }
log = { loaf = "crates-io/log", version = "^0.4" }
md-5 = { loaf = "crates-io/md-5", version = "^0.11.0", optional = true }
memchr = { loaf = "crates-io/memchr", version = "^2.8.1" }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2" }
rand = { loaf = "crates-io/rand", version = "^0.9" }
regex = { loaf = "crates-io/regex", version = "^1.12", optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.11.0", optional = true }
uuid = { loaf = "crates-io/uuid", version = "^1.23", features = ["v4"], optional = true }
