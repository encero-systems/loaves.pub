# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/parking_lot_core"
version = "0.10.0"

[project.features]
backtrace = ["dep:backtrace"]
deadlock_detection = ["petgraph", "backtrace"]
nightly = []
petgraph = ["dep:petgraph"]

[rust]
name = "parking_lot_core"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
backtrace = { loaf = "crates-io/backtrace", version = "^0.3.76", optional = true }
libc = [{ loaf = "crates-io/libc", version = "^0.2.189", target = "cfg(target_os = \"aix\")" }, { loaf = "crates-io/libc", version = "^0.2.191", target = "cfg(any(all(unix, not(target_os = \"aix\")), target_os = \"wasi\"))" }]
petgraph = { loaf = "crates-io/petgraph", version = "^0.8.3", optional = true }
redox_syscall = { loaf = "crates-io/redox_syscall", version = "^0.9.2", target = "cfg(target_os = \"redox\")" }
smallvec = { loaf = "crates-io/smallvec", version = "^1.15.2" }
windows-link = { loaf = "crates-io/windows-link", version = "^0.2.1", target = "cfg(windows)" }
