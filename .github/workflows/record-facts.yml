name: record-facts

# Record build facts on a GitHub-hosted runner of the target's platform, for bindings a shard selects that have no fact
# on the index yet. A build script runs where its target runs: Linux facts are recorded on Linux. Each binding is one
# line of a tab-separated file under bake/facts/: name, version, features (comma-separated, possibly empty), profile,
# domain (target or host), the graph file the binding's feature set came from, for a script with build dependencies the
# build lock that resolves them for this host (an `oven.lock`, which `oven compile-closure` from the toolchain bundle
# bake/toolchain.json pins compiles), and `pinned-clang` for a script whose C or assembly the C toolchain
# release's Clang compiles (RFC 159): on macOS that is the Clang beside this host's Xcode SDK, staged as one owner by
# scripts/stage-pinned-clang.sh, and the `link` records the script's compiles become name that owner.
#
# `loaves-pub record-fact --propose` compiles and runs each build script in the platform's sandbox (bubblewrap on Linux,
# sandbox-exec on macOS) and leaves a proposal; the run uploads them as the `fact-proposals` artifact, and `loaves-pub
# add-fact` on a checkout of `index` admits them, so the index stays the authority. A binding the recorder refuses is
# listed in `refused.tsv` in the same artifact and does not fail the others.
#
# Only GitHub-hosted runners run this. A self-hosted runner never attaches to this public repository, where pull
# requests from forks could reach it.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "The target the facts hold for, recorded on a runner of that platform"
        required: true
        default: x86_64-unknown-linux-gnu
        type: choice
        options: [x86_64-unknown-linux-gnu, aarch64-apple-darwin]
      bindings:
        description: "The bindings file, by its path in this repository (bake/facts/...)"
        required: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.0

jobs:
  record:
    runs-on: ${{ inputs.target == 'x86_64-unknown-linux-gnu' && 'ubuntu-latest' || 'macos-latest' }}
    env:
      TARGET: ${{ inputs.target }}
      BINDINGS: ${{ inputs.bindings }}
    steps:
      - name: Check out the tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tool
          persist-credentials: false
      - name: Check out the index branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: index
          path: index
          persist-credentials: false
      - name: Install oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - name: Download the tool
        run: |
          key="$(git -C tool ls-tree HEAD -- build.sh loaf.toml src tests .github/workflows/check.yml | git hash-object --stdin)"
          oras pull "ghcr.io/encero-systems/loaves.pub/toolchain/loaves-pub:$key-$TARGET" --output "$RUNNER_TEMP/tool" \
            || { echo "::error::no loaves-pub binary for tool key $key yet; the check workflow publishes it when it passes"; exit 1; }
          tar -xzf "$RUNNER_TEMP/tool/loaves-pub.tar.gz" -C "$RUNNER_TEMP/tool"
      - name: Install the Rust toolchain the build scripts are compiled with
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      # A build script with build dependencies links against them, compiled by Oven (`oven compile-closure`) from their
      # adopted archives, with the toolchain bundle bake/toolchain.json pins, installed into a fresh home whose sysroot
      # is the Rust toolchain installed above.
      - name: Install the toolchain bundle that compiles build dependencies
        run: |
          cut -f7 "tool/$BINDINGS" | grep -q . || exit 0
          bundle="$(jq -r --arg target "$TARGET" '.[$target] // ""' tool/bake/toolchain.json)"
          [ -n "$bundle" ] || { echo "::error::bake/toolchain.json pins no toolchain bundle for $TARGET"; exit 1; }
          oras pull "ghcr.io/encero-systems/loaves.pub/toolchain/incan@$bundle" --output "$RUNNER_TEMP/bundle"
          home="$RUNNER_TEMP/incan-home"
          mkdir -p "$home/bin"
          cp "$RUNNER_TEMP/bundle/incan" "$RUNNER_TEMP/bundle/incan-lsp" "$home/bin/"
          chmod +x "$home/bin/incan" "$home/bin/incan-lsp"
          ln -s incan "$home/bin/oven"
          INCAN_SYSROOT="$(rustup run "$RUST_TOOLCHAIN" rustc --print sysroot)" INCAN_HOME="$home" INCAN_NO_BANNER=1 \
            "$home/bin/incan" toolchain install "$RUNNER_TEMP/bundle/toolchain.tar.zst"
      - name: Install the build-script sandbox
        if: runner.os == 'Linux'
        # Ubuntu confines unprivileged user namespaces, which bubblewrap needs for its network namespace.
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Stage the pinned Clang beside this host's SDK
        if: runner.os == 'macOS'
        run: |
          if cut -f8 "tool/$BINDINGS" | grep -qx pinned-clang; then
            tool/scripts/stage-pinned-clang.sh "$RUNNER_TEMP/c-owner" >> "$GITHUB_ENV"
          fi
      - name: Fetch the source Loaf archives of the bindings' shards
        run: |
          [ -s "tool/$BINDINGS" ] || { echo "::error::no bindings at $BINDINGS; name the file by its path in this repository"; exit 1; }
          cut -f6 "tool/$BINDINGS" | sort -u | while read -r graph; do
            "$RUNNER_TEMP/tool/loaves-pub" fetch-sources "tool/$(dirname "$graph")/lock.json" \
              --blobs "$RUNNER_TEMP/blobs" --work "$RUNNER_TEMP/fetch"
          done
          # The build locks a binding names in its seventh field resolve its build dependencies for this host.
          cut -f7 "tool/$BINDINGS" | grep . | sort -u | while read -r lock; do
            "$RUNNER_TEMP/tool/loaves-pub" fetch-sources "tool/$lock" --blobs "$RUNNER_TEMP/blobs" --work "$RUNNER_TEMP/fetch"
          done
      - name: Record each binding's fact as a proposal
        env:
          INCAN_HOME: ${{ runner.temp }}/incan-home
          INCAN_NO_BANNER: "1"
        run: |
          rustc="$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
          mkdir -p "$RUNNER_TEMP/proposals"
          : > "$RUNNER_TEMP/proposals/refused.tsv"
          index=0
          # Fields are split on `|`, not tab: a shell `read` collapses adjacent tabs, and an empty feature set is a field.
          tr "\t" "|" < "tool/$BINDINGS" | while IFS="|" read -r name version features profile domain graph lock compiler; do
            index=$((index + 1))
            work="$RUNNER_TEMP/work/$index"
            build=()
            if [ -n "$lock" ]; then build=(--oven "$RUNNER_TEMP/incan-home/bin/oven" --build-lock "tool/$lock"); fi
            if [ "$compiler" = pinned-clang ]; then
              [ -n "${PINNED_CLANG_BIN:-}" ] || { echo "::error::$name $version names pinned-clang, which only a macOS runner stages"; exit 1; }
              build+=(--cc "$PINNED_CLANG_BIN/clang" --cxx "$PINNED_CLANG_BIN/clang++" --ar "$PINNED_CLANG_BIN/llvm-ar" \
                --sysroot "$PINNED_CLANG_SYSROOT")
            fi
            if output="$("$RUNNER_TEMP/tool/loaves-pub" record-fact "$name" "$version" --features "$features" \
                --profile "$profile" --domain "$domain" --graph "tool/$graph" --rustc "$rustc" \
                --cache "$RUNNER_TEMP/cache" --blobs "$RUNNER_TEMP/blobs" --work "$work" --root index --propose \
                "${build[@]}" 2>&1)"; then
              echo "$output"
              proposal="$(printf '%s\n' "$output" | sed -n 's/^proposed: //p')"
              if [ -n "$proposal" ]; then
                # The proposal directory holds the out files and graph the fact names, beside proposal.json.
                cp -R "$(dirname "$proposal")" "$RUNNER_TEMP/proposals/$index-$name-$version"
              fi
            else
              printf '%s\t%s\t%s\t%s\n' "$name" "$version" "$features" "$(printf '%s\n' "$output" | grep -m1 '^refused:')" >> "$RUNNER_TEMP/proposals/refused.tsv"
            fi
          done
          echo "proposals: $(find "$RUNNER_TEMP/proposals" -name proposal.json | wc -l), refused: $(wc -l < "$RUNNER_TEMP/proposals/refused.tsv")"
      - name: Upload the fact proposals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fact-proposals
          path: ${{ runner.temp }}/proposals
          include-hidden-files: true
