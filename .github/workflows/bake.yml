name: bake

# Compile shards of adopted Loaves on a GitHub-hosted runner and push every unit they compiled to the GitHub Container
# Registry as an asset, under a build-provenance attestation over the unit archives. A shard is a directory under
# `bake/` holding `oven.lock` files (`*.oven.lock`, format 1), each written by `oven lock` with the registry, revision
# and archive digest of every crates.io entry. One run compiles every lock of the shards it is given in one
# `oven compile-closure`: each lock is its own graph with its own feature unification, and a unit two locks share is
# compiled once.
#
# The closure is compiled twice, in two roots, and `pack-units --reproduces` refuses the run unless both give every unit
# the same identity, entry and archive bytes: a unit that depends on where it was compiled is never published.
#
# Compiling runs third-party code: every proc macro in a closure executes inside rustc. So the `compile` job holds no
# credential at all, with a read-only token that its checkouts do not keep, no package write and no OIDC token, and it
# hands the packed units to the `publish` job as an artifact. Only `publish` can attest and push, and it runs nothing
# but this repository's own tool. A macro can therefore neither push a package, overwrite a tag another run pulls, nor
# mint a provenance attestation.
#
# The run proposes; it does not record. It uploads the asset proposals as the `asset-proposals` artifact, and
# `loaves-pub admit-assets` on a checkout of `index` records them after pulling each archive anonymously, so the index
# stays the authority. Packages this workflow creates take the visibility of this public repository; a package first
# pushed from anywhere else comes out private.
#
# Only GitHub-hosted runners run this. A self-hosted runner never attaches to this public repository, where pull
# requests from forks could reach it.

run-name: bake ${{ inputs.target }} ${{ inputs.profile }} ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Space-separated directories under bake/, each holding *.oven.lock files"
        required: true
      target:
        description: "The target every lock is compiled for, on a runner of that platform"
        required: true
        default: aarch64-apple-darwin
        type: choice
        options: [aarch64-apple-darwin]
      profile:
        description: "The profile every lock is compiled in"
        required: true
        default: release
        type: choice
        options: [debug, release]
      only:
        description: "Comma-separated NAME@VERSION units to publish; every unit the closure compiled when empty"
        required: false
        default: ""
      label:
        description: "A name for this run, shown in its title, so a caller that dispatches several can find its own"
        required: false
        default: ""

permissions:
  contents: read

env:
  # The Incan toolchain bundle whose `oven compile-closure` compiles the closure: `incan`, `incan-lsp` and
  # `toolchain.tar.zst`, pulled from the GHCR package `toolchain/incan` by the digest of the target's image, so a tag
  # pushed again cannot change what compiles a unit. `BAKE_INCAN` is the commit the bundle was built from, the
  # toolchain every asset of the run names. A target is offered above once its bundle is pinned here. The tool itself is
  # the binary the check workflow published for this commit's tool key (`toolchain/loaves-pub:<tool key>-<triple>`; see
  # check.yml).
  BAKE_INCAN: ""
  BAKE_INCAN_MACOS: ""
  RUST_TOOLCHAIN: 1.98.0

jobs:
  compile:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      SHARDS: ${{ inputs.shards }}
      PROFILE: ${{ inputs.profile }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out the tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tool
          persist-credentials: false
      - name: Check out the index branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: index
          path: index
          persist-credentials: false
      - name: Install oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - name: Download the tool and the toolchain bundle
        # oras checks every file it pulls against the digest the pinned manifest lists for it.
        run: |
          [ -n "$BAKE_INCAN" ] && [ -n "$BAKE_INCAN_MACOS" ] || { echo "::error::no toolchain bundle pinned for $TARGET"; exit 1; }
          key="$(git -C tool ls-tree HEAD -- build.sh loaf.toml src tests .github/workflows/check.yml | git hash-object --stdin)"
          oras pull "ghcr.io/encero-systems/loaves.pub/toolchain/loaves-pub:$key-$TARGET" \
            --output "$RUNNER_TEMP/tool" \
            || { echo "::error::no loaves-pub binary for tool key $key yet; the check workflow publishes it when it passes"; exit 1; }
          tar -xzf "$RUNNER_TEMP/tool/loaves-pub.tar.gz" -C "$RUNNER_TEMP/tool"
          oras pull "ghcr.io/encero-systems/loaves.pub/toolchain/incan@$BAKE_INCAN_MACOS" --output "$RUNNER_TEMP/bundle"
          for file in incan incan-lsp toolchain.tar.zst; do
            [ -f "$RUNNER_TEMP/bundle/$file" ] || { echo "::error::the pinned bundle has no $file"; exit 1; }
          done
      - name: Install the Rust toolchain the units are compiled with, twice
        # The second root compiles with a second copy at another path that also carries rust-src, so the gate below
        # proves a unit depends on neither where the toolchain is installed nor which components it has.
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          RUSTUP_HOME="$RUNNER_TEMP/rustup-src" CARGO_HOME="$RUNNER_TEMP/cargo-src" \
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src
      - name: Install the bundle into one fresh home per root
        run: |
          for root in first second; do
            home="$RUNNER_TEMP/$root/home"
            rust=()
            [ "$root" = second ] && rust=(RUSTUP_HOME="$RUNNER_TEMP/rustup-src" CARGO_HOME="$RUNNER_TEMP/cargo-src")
            mkdir -p "$home/bin"
            cp "$RUNNER_TEMP/bundle/incan" "$RUNNER_TEMP/bundle/incan-lsp" "$home/bin/"
            chmod +x "$home/bin/incan" "$home/bin/incan-lsp"
            ln -s incan "$home/bin/oven"
            env "${rust[@]}" INCAN_HOME="$home" INCAN_NO_BANNER=1 "$home/bin/incan" toolchain install \
              "$RUNNER_TEMP/bundle/toolchain.tar.zst"
          done
      - name: Fetch the locks' source Loaf archives
        run: |
          : > "$RUNNER_TEMP/locks.txt"
          for shard in $SHARDS; do
            found=0
            for lock in "tool/bake/$shard"/*.oven.lock; do
              [ -f "$lock" ] || continue
              found=1
              echo "$GITHUB_WORKSPACE/$lock" >> "$RUNNER_TEMP/locks.txt"
              "$RUNNER_TEMP/tool/loaves-pub" fetch-sources "$lock" \
                --blobs "$RUNNER_TEMP/sources/blobs" --work "$RUNNER_TEMP/fetch"
            done
            [ "$found" = 1 ] || { echo "::error::bake/$shard holds no *.oven.lock"; exit 1; }
          done
      - name: Compile the closure twice, in two roots, and pack the units that reproduce
        env:
          ONLY: ${{ inputs.only }}
          INCAN_NO_BANNER: "1"
        run: |
          locks=()
          while read -r lock; do locks+=("$lock"); done < "$RUNNER_TEMP/locks.txt"
          for root in first second; do
            rust=()
            [ "$root" = second ] && rust=(RUSTUP_HOME="$RUNNER_TEMP/rustup-src" CARGO_HOME="$RUNNER_TEMP/cargo-src")
            mkdir -p "$RUNNER_TEMP/$root/work"
            (cd "$RUNNER_TEMP/$root/work" && env "${rust[@]}" INCAN_HOME="$RUNNER_TEMP/$root/home" \
              "$RUNNER_TEMP/$root/home/bin/oven" compile-closure "${locks[@]}" --profile "$PROFILE" \
              --sources "$RUNNER_TEMP/sources" --index "$GITHUB_WORKSPACE/index" --out "$RUNNER_TEMP/$root/result")
          done
          # A unit the closure refuses (one that does not compile, or misses a fact) and every unit that links it is
          # listed in the artifact, and nothing is published: pack-units takes only a closure that refused nothing.
          mkdir -p "$RUNNER_TEMP/units" "$RUNNER_TEMP/proposals"
          jq -r '.refused[] | "\(.loaf)\t\(.version)\t\(.reason | split("\n")[0] | .[0:300])"' \
            "$RUNNER_TEMP/first/result/closure.json" > "$RUNNER_TEMP/proposals/refused.tsv"
          if [ -s "$RUNNER_TEMP/proposals/refused.tsv" ]; then
            echo "::error::$(wc -l < "$RUNNER_TEMP/proposals/refused.tsv") unit(s) refused; see refused.tsv in the packed-units artifact"
            cat "$RUNNER_TEMP/proposals/refused.tsv"
            exit 1
          fi
          "$RUNNER_TEMP/tool/loaves-pub" pack-units "$RUNNER_TEMP/first/result" --out "$RUNNER_TEMP/units/closure" \
            --only "$ONLY" --reproduces "$RUNNER_TEMP/second/result"
      - name: Hand the packed units to the publish job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packed-units
          path: |
            ${{ runner.temp }}/units
            ${{ runner.temp }}/proposals
          retention-days: 1

  publish:
    needs: compile
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out the tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tool
          persist-credentials: false
      - name: Install oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - name: Download the tool
        run: |
          key="$(git -C tool ls-tree HEAD -- build.sh loaf.toml src tests .github/workflows/check.yml | git hash-object --stdin)"
          oras pull "ghcr.io/encero-systems/loaves.pub/toolchain/loaves-pub:$key-$TARGET" \
            --output "$RUNNER_TEMP/tool" \
            || { echo "::error::no loaves-pub binary for tool key $key yet; the check workflow publishes it when it passes"; exit 1; }
          tar -xzf "$RUNNER_TEMP/tool/loaves-pub.tar.gz" -C "$RUNNER_TEMP/tool"
      - name: Take the packed units from the compile job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packed-units
          path: ${{ runner.temp }}
      - name: Attest the unit archives
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/units/closure/*.tar
      - name: Push the units
        env:
          LOAVES_PUB_REGISTRY_USER: ${{ github.actor }}
          LOAVES_PUB_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION: ${{ steps.attest.outputs.attestation-url }}
        run: |
          "$RUNNER_TEMP/tool/loaves-pub" push-units "$RUNNER_TEMP/units/closure" --builder registry \
            --attestation "$ATTESTATION" --toolchain "incan@$BAKE_INCAN" \
            --proposals "$RUNNER_TEMP/proposals" --work "$RUNNER_TEMP/push"
      - name: Upload the asset proposals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asset-proposals
          path: ${{ runner.temp }}/proposals
